openapi: 3.1.0
info:
  title: Secure Disk Backend API
  version: 0.4.3
  description: "Control Plane API v0.4.3: account sessions, trusted device management, VMK envelopes and signed QR device pairing."
servers:
  - url: http://localhost:3001/api/v1
    description: Local development
security: []
tags:
  - name: System
  - name: Auth
  - name: Devices
  - name: Vault
  - name: Pairing
paths:
  /csrf-token:
    get:
      tags: [System]
      operationId: getCsrfToken
      summary: Issue or return a CSRF token cookie
      responses:
        '200':
          description: CSRF token returned and set in a readable cookie
          content:
            application/json:
              schema:
                type: object
                required: [csrf_token]
                properties:
                  csrf_token: { type: string }
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Create a pending account
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 12, maxLength: 128 }
                display_name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '201':
          description: Account created. In development only, dev_verification_token may be returned.
          content:
            application/json:
              schema:
                type: object
                required: [user_id, email, status, email_verification_required, message]
                properties:
                  user_id: { type: string, format: uuid }
                  email: { type: string, format: email }
                  status: { type: string, const: pending_verification }
                  email_verification_required: { type: boolean, const: true }
                  message: { type: string }
                  dev_verification_token: { type: string, description: Development only. Never returned in production. }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/verify-email:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Verify email address using a one-time token
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, minLength: 30, maxLength: 128 }
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                type: object
                required: [email_verified, user_id, email, status, verified_at]
                properties:
                  email_verified: { type: boolean, const: true }
                  user_id: { type: string, format: uuid }
                  email: { type: string, format: email }
                  status: { type: string, enum: [pending, active] }
                  verified_at: { type: string, format: date-time }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/resend-verification:
    post:
      tags: [Auth]
      operationId: resendVerification
      summary: Resend email verification message
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '202':
          description: Generic response to avoid email account enumeration
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
                  dev_verification_token: { type: string, description: Development only. }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Login with email and password
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Login successful; sets HttpOnly access and refresh cookies plus readable CSRF cookie
          headers:
            Set-Cookie:
              description: access_token and refresh_token in development; __Host-access and __Host-refresh in production.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [user, sync_room_id, csrf_token, session]
                properties:
                  user:
                    type: object
                    required: [id, email, status]
                    properties:
                      id: { type: string, format: uuid }
                      email: { type: string, format: email }
                      display_name: { type: [string, 'null'] }
                      status: { type: string, enum: [pending, active] }
                  sync_room_id: { type: string, description: Opaque rendezvous label; not an authorization credential. }
                  csrf_token: { type: string }
                  session:
                    type: object
                    required: [access_expires_in_seconds, refresh_expires_at]
                    properties:
                      access_expires_in_seconds: { type: integer, minimum: 60, maximum: 3600 }
                      refresh_expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '501':
          description: Account has TOTP enabled; TOTP login is not implemented in v0.1 and is not bypassed.
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentSession
      summary: Return the current account and its Trystero sync room identity
      description: Requires a valid access cookie. Use this after page reload to restore account/session context without exposing an authorization secret in local storage.
      security:
        - accessCookie: []
      responses:
        '200':
          description: Current account session
          content:
            application/json:
              schema:
                type: object
                required: [user, sync_room_id]
                properties:
                  user: { type: object }
                  sync_room_id: { type: string, description: Opaque rendezvous label; not an authorization credential. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Rotate access and refresh cookies
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Tokens rotated. Refresh expiry remains the session's original absolute expiry.
          content:
            application/json:
              schema:
                type: object
                required: [user, csrf_token, session]
                properties:
                  user: { type: object }
                  csrf_token: { type: string }
                  session:
                    type: object
                    properties:
                      access_expires_in_seconds: { type: integer }
                      refresh_expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /devices:
    get:
      tags: [Devices]
      operationId: listDevices
      summary: List devices belonging to the authenticated account
      security: [{ accessCookie: [] }]
      responses:
        '200': { description: Device inventory; public keys and private material are not returned. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /devices/register:
    post:
      tags: [Devices]
      operationId: registerDevice
      summary: Register the current device public keys as pending until proof of possession
      description: Requires an active cookie session and session-bound CSRF token. New devices are pending until an Ed25519 challenge is signed. Private keys must never be sent.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [device_name, device_type, signing_algorithm, encryption_algorithm, public_key, encryption_public_key]
              properties:
                device_name: { type: string, minLength: 1, maxLength: 80 }
                device_type: { type: string, enum: [browser, desktop, mobile, nas, server, other] }
                platform: { type: string, maxLength: 100 }
                app_version: { type: string, maxLength: 50 }
                signing_algorithm: { type: string, const: Ed25519 }
                encryption_algorithm: { type: string, const: X25519 }
                public_key: { type: string, minLength: 40, maxLength: 48, description: Canonical Base64 of 32 raw Ed25519 public-key bytes. }
                encryption_public_key: { type: string, minLength: 40, maxLength: 48, description: Canonical Base64 of 32 raw X25519 public-key bytes. }
      responses:
        '201':
          description: New device registered in pending state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceRegistrationResponse' }
        '200':
          description: Existing device identity found; a fresh proof challenge is still required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceRegistrationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /devices/{deviceId}/challenge:
    post:
      tags: [Devices]
      operationId: createDeviceChallenge
      summary: Create a short-lived, session-bound proof-of-possession challenge
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfHeader'
      security: [{ accessCookie: [] }]
      responses:
        '201': { description: Challenge message and expiry returned; response is not cacheable. }
        '404': { description: Device not found. }
        '409': { $ref: '#/components/responses/Conflict' }
  /devices/{deviceId}/verify:
    post:
      tags: [Devices]
      operationId: verifyDeviceProof
      summary: Verify Ed25519 proof and bind the current session to the device
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfHeader'
      security: [{ accessCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_id, signature]
              properties:
                challenge_id: { type: string, format: uuid }
                signature: { type: string, description: Canonical Base64 Ed25519 signature (64 bytes). }
      responses:
        '200': { description: Proof verified; device activated and session bound. }
        '401': { description: Signature is invalid. }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { description: Challenge expired or already consumed. }
  /devices/{deviceId}/history:
    get:
      tags: [Devices]
      operationId: getDeviceHistory
      summary: Get device lifecycle events and public-key history
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      security: [{ accessCookie: [] }]
      responses:
        '200': { description: Device events and public key versions. }
        '404': { description: Device not found. }
  /devices/{deviceId}/revoke:
    post:
      tags: [Devices]
      operationId: revokeDevice
      summary: Revoke a device, its active sessions and device vault envelope
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfHeader'
      security: [{ accessCookie: [] }]
      responses:
        '200': { description: Device revoked; associated sessions and device key envelope removed. }
        '404': { description: Device not found. }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke current session and clear cookies
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      security:
        - accessCookie: []
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                type: object
                required: [logged_out]
                properties:
                  logged_out: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /vault/envelope:
    get:
      tags: [Vault]
      operationId: getVaultEnvelope
      summary: Get the current device's opaque VMK envelope
      responses:
        '200':
          description: Vault state and current device envelope; plaintext VMK is never returned
          content:
            application/json:
              schema:
                type: object
                required: [initialized, envelope]
                properties:
                  initialized: { type: boolean }
                  vault_id: { type: string, format: uuid }
                  crypto_version: { type: integer }
                  envelope:
                    oneOf:
                      - type: 'null'
                      - $ref: '#/components/schemas/VmkEnvelope'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /vault/initialize:
    post:
      tags: [Vault]
      operationId: initializeVault
      summary: Initialize the Vault with a device-signed encrypted VMK envelope
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [vault_id, envelope, signature]
              properties:
                vault_id: { type: string, format: uuid }
                envelope: { $ref: '#/components/schemas/PairingEnvelope' }
                signature: { type: string, description: Canonical Base64 Ed25519 signature }
      responses:
        '201': { description: Vault initialized; VMK envelope stored }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /devices/pairing/invite:
    post:
      tags: [Pairing]
      operationId: createDevicePairingInvite
      summary: Create a five-minute one-time invitation from a trusted device
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '201':
          description: One-time token returned to the trusted client for QR display; only its hash is stored
          content:
            application/json:
              schema:
                type: object
                required: [invite_id, invite_token, expires_at]
                properties:
                  invite_id: { type: string, format: uuid }
                  invite_token: { type: string, description: 256-bit Base64URL single-use token }
                  expires_at: { type: string, format: date-time }
        '409': { $ref: '#/components/responses/Conflict' }
  /devices/pairing/invite/{inviteId}/status:
    get:
      tags: [Pairing]
      operationId: getDevicePairingInviteStatus
      summary: Poll invite state and claimed-device details as the initiating trusted device
      parameters:
        - name: inviteId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Invite status; claimed_device is provided after a valid claim }
        '404': { description: Invite not found for the initiating device }
  /devices/pairing/claim:
    post:
      tags: [Pairing]
      operationId: claimDevicePairingInvite
      summary: Claim an invite from a separately authenticated and proof-verified device
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [invite_id, invite_token, public_key, encryption_public_key]
              properties:
                invite_id: { type: string, format: uuid }
                invite_token: { type: string, description: 256-bit Base64URL token }
                public_key: { type: string, description: Registered Ed25519 raw public key in Base64 }
                encryption_public_key: { type: string, description: Registered X25519 raw public key in Base64 }
      responses:
        '200': { description: Claim accepted; trusted device can now review the device }
        '404': { description: Invite not found }
        '410': { description: Invite expired or already used }
        '422': { $ref: '#/components/responses/ValidationError' }
  /devices/pairing/{inviteId}/result:
    get:
      tags: [Pairing]
      operationId: getDevicePairingInviteResult
      summary: Poll the invitation result as the device that claimed it
      parameters:
        - name: inviteId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Invite state; encrypted envelope is returned only after approval }
        '404': { description: Invite not found for the claimed device }
  /devices/pairing/invite/{inviteId}/cancel:
    post:
      tags: [Pairing]
      operationId: cancelDevicePairingInvite
      summary: Cancel an active invitation from its initiating device
      parameters:
        - name: inviteId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200': { description: Invitation cancelled }
        '404': { description: Active invitation not found }
  /devices/pairing/start:
    post:
      tags: [Pairing]
      operationId: startDevicePairing
      summary: Create a 10-minute pairing request for the current active device
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '201':
          description: One-time token returned to the initiating client; store it in the signed QR only
          content:
            application/json:
              schema:
                type: object
                required: [request_id, pairing_token, expires_at]
                properties:
                  request_id: { type: string, format: uuid }
                  pairing_token: { type: string, description: 256-bit Base64URL one-time token }
                  expires_at: { type: string, format: date-time }
        '409': { $ref: '#/components/responses/Conflict' }
  /devices/pairing/{requestId}:
    get:
      tags: [Pairing]
      operationId: getDevicePairing
      summary: Poll as target or retrieve target details as an approving trusted device
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Pairing-Token
          in: header
          required: false
          schema: { type: string, description: Required for an approving source device; never put in a URL }
      responses:
        '200': { description: Pairing state; target receives the encrypted envelope only after approval }
        '404': { description: Pairing request not found }
  /devices/pairing/{requestId}/approve:
    post:
      tags: [Pairing]
      operationId: approveDevicePairing
      summary: Approve a legacy request or a v0.4.3 invite with an opaque VMK envelope and trusted-device signature
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Pairing-Token
          in: header
          required: false
          schema: { type: string, description: Required only for legacy v0.4.2 request approvals }
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [envelope, signature]
              properties:
                envelope: { $ref: '#/components/schemas/PairingEnvelope' }
                signature: { type: string, description: Ed25519 signature over request, source, target, vault and envelope digest }
      responses:
        '200': { description: Envelope accepted and request approved }
        '401': { description: Invalid source-device signature }
        '410': { description: Request expired or no longer pending }
  /devices/pairing/{requestId}/complete:
    post:
      tags: [Pairing]
      operationId: completeDevicePairing
      summary: Complete legacy or v0.4.3 pairing after target decrypts VMK and signs envelope digest
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [signature]
              properties:
                signature: { type: string, description: Target Ed25519 completion signature }
      responses:
        '200': { description: Device VMK envelope installed; pairing completed }
        '401': { description: Invalid target completion signature }
        '409': { $ref: '#/components/responses/Conflict' }
  /devices/pairing/{requestId}/cancel:
    post:
      tags: [Pairing]
      operationId: cancelDevicePairing
      summary: Cancel a pending or approved request from its target session
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200': { description: Pairing request cancelled }
        '404': { description: Pairing request not found }
components:
  parameters:
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: Development name. Production uses __Host-access.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Development name. Production uses __Host-refresh.
  responses:
    Unauthorized:
      description: Authentication or refresh token is invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: CSRF, email verification or account policy error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Account or resource state conflicts with the requested operation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Gone:
      description: Verification token is expired or already used
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    VmkEnvelope:
      type: object
      required: [format_id, format_version, key_derivation_algorithm, key_derivation_params, salt, nonce, ciphertext, aad_version]
      properties:
        format_id: { type: string, const: vault-device-envelope-v1 }
        format_version: { type: integer, const: 1 }
        key_derivation_algorithm: { type: string, const: X25519+HKDF-SHA256 }
        key_derivation_params: { type: object }
        salt: { type: string, description: Base64 16 bytes }
        nonce: { type: string, description: Base64 12 bytes }
        ciphertext: { type: string, description: Base64 AES-GCM ciphertext and 128-bit tag }
        aad_version: { type: integer, const: 1 }
    PairingEnvelope:
      type: object
      additionalProperties: false
      required: [ephemeral_public_key, salt, nonce, ciphertext]
      properties:
        ephemeral_public_key: { type: string, description: Base64 X25519 raw public key, 32 bytes }
        salt: { type: string, description: Base64 16 bytes }
        nonce: { type: string, description: Base64 12 bytes }
        ciphertext: { type: string, description: Base64 48 bytes for 32-byte VMK plus GCM tag }
    DeviceRegistrationResponse:
      type: object
      required: [created, device]
      properties:
        created: { type: boolean }
        device:
          type: object
          required: [id, device_name, device_type, signing_algorithm, encryption_algorithm, signing_key_version, encryption_key_version, status, created_at]
          properties:
            id: { type: string, format: uuid }
            device_name: { type: string }
            device_type: { type: string }
            platform: { type: [string, 'null'] }
            app_version: { type: [string, 'null'] }
            signing_algorithm: { type: string, const: Ed25519 }
            encryption_algorithm: { type: string, const: X25519 }
            signing_key_version: { type: integer }
            encryption_key_version: { type: integer }
            status: { type: string, enum: [pending, active] }
            created_at: { type: string, format: date-time }
            last_seen_at: { type: [string, 'null'], format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: array, items: { type: object } }
