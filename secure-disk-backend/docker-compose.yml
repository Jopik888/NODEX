services:
  postgres:
    image: postgres:16-alpine
    container_name: secure-disk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: secure_disk
      POSTGRES_USER: secure_disk
      POSTGRES_PASSWORD: change_me_local_only
    ports:
      - "5432:5432"
    volumes:
      - secure_disk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secure_disk -d secure_disk"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  secure_disk_pgdata:
