name: NODEX Alpha 1 validation

on:
  push:
    branches:
      - feature/alpha1-build-preparation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend install, syntax and tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: secure-disk-backend/package-lock.json

      - name: Install locked backend dependencies
        working-directory: secure-disk-backend
        run: npm ci --no-audit --no-fund

      - name: Check JavaScript syntax
        working-directory: secure-disk-backend
        run: npm run check

      - name: Run backend tests
        working-directory: secure-disk-backend
        run: npm test

      - name: Verify native Argon2 module loads
        working-directory: secure-disk-backend
        run: node --input-type=module -e "import('argon2').then(() => console.log('argon2 native module loaded'))"

  desktop:
    name: Desktop install and syntax
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install locked desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Check Electron entry points
        working-directory: desktop
        shell: pwsh
        run: |
          node --check main.cjs
          node --check preload.cjs
          node --check service-manager.cjs
          node --check setup-renderer.js
          node --check preflight.cjs
